services:
  backend:
    build:
      context: .
      target: backend
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy && node dist/src/index.js
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3011}:3001"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/').then((response) => {
          response.ok ? process.exit(0) : process.exit(1);
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

